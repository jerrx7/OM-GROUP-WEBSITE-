<style>
:root{
  --accent:#F15A29;
  --accent-deep:#D94817;
  --accent-soft:rgba(241,90,41,.10);
  --ink:#141416;
  --grey:#6B6B6B;
  --grey-2:#8E8E8E;
  --bone:#FAF8F3;
  --white:#FFFFFF;
  --line:rgba(20,20,22,.10);
  --serif:"Cormorant Garamond","Playfair Display",Georgia,serif;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --ease-premium:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--sans);
  background:var(--white);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  font-weight:400;line-height:1.6;
  overflow-x:hidden;
  min-height:100dvh;
  display:flex;flex-direction:column;
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}

.container{max-width:1080px;margin:0 auto;padding:0 24px}

/* ===== NAV (matches site sub-page header) ===== */
.nav{
  position:relative;z-index:100;height:72px;display:flex;align-items:center;
  background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);
}
.nav-row{display:flex;align-items:center;justify-content:space-between;gap:20px;width:100%}
.brand-logo{height:44px;display:flex;align-items:center}
.brand-logo img{height:100%;width:auto;object-fit:contain}
.nav-actions{display:flex;align-items:center;gap:20px}
.nav-back{
  font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--grey);
  display:flex;align-items:center;gap:6px;transition:color .2s;
}
.nav-back:hover{color:var(--accent)}

/* ===== BUTTONS ===== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:44px;padding:0 20px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  font-weight:600;border-radius:1px;border:1px solid transparent;cursor:pointer;
  transition:transform .3s var(--ease-premium),background .3s ease,color .25s ease,border-color .25s ease,box-shadow .4s ease;
}
.btn:hover{transform:translateY(-2px)}
.btn-accent{background:var(--accent);color:var(--white)}
.btn-accent:hover{background:var(--accent-deep);box-shadow:0 18px 40px -16px rgba(241,90,41,.55)}

/* ===== 404 HERO ===== */
.notfound{flex:1;display:flex;align-items:center;justify-content:center;background:var(--bone);padding:64px 0}
.notfound-inner{display:flex;flex-direction:column;align-items:center;text-align:center}
.notfound-mark{width:min(72vw,420px);height:auto;margin-bottom:8px}
.notfound-copy{
  font-family:var(--sans);font-size:clamp(15px,1.6vw,19px);font-weight:400;
  letter-spacing:.24em;text-transform:uppercase;color:var(--grey);margin-top:8px;
}
.notfound-cta{
  display:inline-flex;align-items:center;gap:10px;margin-top:36px;
  font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);
  padding-bottom:5px;border-bottom:1px solid transparent;
  transition:border-color .25s ease,gap .25s var(--ease-premium);
}
.notfound-cta:hover{border-color:var(--accent);gap:13px}
.notfound-cta svg{display:block}
.notfound-links{display:flex;gap:28px;margin-top:44px;flex-wrap:wrap;justify-content:center}
.notfound-links a{
  font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--grey-2);
  transition:color .2s;
}
.notfound-links a:hover{color:var(--accent)}

/* ===== FOOTER ===== */
footer{background:var(--bone);color:var(--ink);padding:32px 0;border-top:1px solid var(--line);text-align:center}
footer p{font-size:12px;color:var(--grey);letter-spacing:.02em}
footer a{color:var(--grey);transition:color .2s}
footer a:hover{color:var(--accent)}

@media (max-width:640px){
  .container{padding:0 20px}
  .notfound{padding:48px 0}
  .notfound-links{gap:18px 22px}
}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .btn:hover,.notfound-cta:hover{transform:none !important}
}
